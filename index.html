<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M={
parity:{t:'Parity',len:8,def:'10110010',one:'One extra bit that makes the count of 1s even.',
exp:['<p>Bits travel as voltages, light pulses or radio waves, and noise can flip one. The receiver cannot see the sender’s data, so the sender adds a little <b>redundancy</b>: extra information that the data must agree with.</p><p>With <b>even parity</b>, the sender counts the 1s in the data and adds one more bit so the total number of 1s is even. The receiver counts again. An odd total means at least one bit changed. <b>Odd parity</b> is the mirror image.</p>','<h3>Worked example</h3><p>Data <code>10110010</code> has four 1s, which is already even, so the parity bit is 0 and the frame is <code>101100100</code>. Flip one bit and the receiver counts an odd number of 1s: error detected. Flip two bits and the count is even again: the error slips through.</p><h3>Strengths and limits</h3><p>Very cheap (one bit) and fast. It detects every odd-sized error but misses every even-sized one, it cannot say <i>where</i> the error is, and it cannot fix it.</p>'],
real:['Serial links (UART) can add a parity bit to each byte.','RAID 5 stores XOR parity across disks so a lost disk can be rebuilt.','Older computer memory used a parity bit per byte to spot damaged RAM.'],
note:['<h3>Parity</h3>','extra bit → total 1s <b>even</b> (even parity)','10110010 → four 1s → bit = 0','send 101100100','receiver counts: odd = <em>ERROR</em>','1 flip → caught ✔','2 flips → cancel! <em>missed ✘</em>','detects only, never corrects'],
q:['Data 1110 (three 1s), even parity. The parity bit is…',['0','1'],1,'Three 1s is odd, so add a 1 to make four.'],
yt:'parity bit error detection explained'},
checksum:{t:'Checksum',len:16,def:'0101100111110000',one:'Add the bytes, fold the carry, flip the bits.',
exp:['<p>A checksum treats the data as numbers. The sender splits it into bytes, adds them, and sends the (complemented) total along with the data. The receiver adds everything again, including the checksum, and expects a fixed result.</p><h3>Worked example (8-bit)</h3><p>Bytes <code>0x59</code> and <code>0xF0</code> add to <code>0x149</code>, which is 9 bits. The extra carry is added back in (<b>end-around carry</b>): <code>0x49 + 1 = 0x4A</code>. Flip every bit (the <b>complement</b>): <code>0xB5</code> is the checksum.</p><p>Receiver: <code>0x59 + 0xF0 + 0xB5</code> with end-around carry equals <code>0xFF</code> (all 1s) when nothing changed.</p>','<h3>Strengths and limits</h3><p>Compact, and catches many byte changes. But swapping two bytes, or one error plus a compensating error, gives the same sum: a <b>collision</b>. It detects only.</p>'],
real:['IPv4 headers, TCP and UDP use a 16-bit one’s-complement checksum.','ISBN and barcode check digits are checksums in spirit.','Download pages often list a checksum so you can verify a file.'],
note:['<h3>Checksum</h3>','split into bytes, <b>add them</b>','carry out? add it back (end-around)','0x59 + 0xF0 = 0x149 → 0x4A','flip all bits → <b>0xB5</b>','receiver: total must be 0xFF','collisions possible <em>✘</em>','detects only'],
q:['A checksum sum overflows 8 bits. The carry is…',['Dropped','Added back in'],1,'That is the end-around carry.'],
yt:'internet checksum explained computer networks'},
crc:{t:'CRC',len:8,def:'10110010',one:'Divide the bits like a polynomial and send the remainder.',
exp:['<p>A cyclic redundancy check treats the data as one huge binary number and divides it by an agreed <b>generator</b>. The division uses XOR instead of subtraction (<b>modulo-2</b>), so there are no borrows. The sender transmits the data plus the remainder. The receiver divides the whole frame: remainder zero means it looks intact.</p><h3>Worked example</h3><p>Generator <code>100000111</code> (x⁸ + x² + x + 1). Payload <code>1101</code>.</p><p>1) Append eight zeros: <code>110100000000</code>.<br>2) Divide with XOR: remainder <code>00100011</code>.<br>3) Send <code>110100100011</code>.<br>4) Receiver divides again and expects remainder 0.</p>','<h3>Strengths and limits</h3><p>Excellent at catching burst errors (several adjacent bad bits) and many common patterns, and easy in hardware. It still cannot tell which bit is wrong, so networks respond by asking for a resend.</p>'],
real:['Ethernet frames end with a CRC-32 frame check sequence.','ZIP and PNG files store CRC-32 values to detect corruption.','Storage and USB links use CRCs to catch burst errors.'],
note:['<h3>CRC</h3>','generator: 100000111','1) append 8 zeros','2) divide with XOR (mod-2)','3) send data + <b>remainder</b>','1101 → 110100100011','receiver remainder = 0 ✔','great for bursts, <em>no fixing</em>'],
q:['CRC division uses…',['XOR instead of subtraction','Ordinary subtraction'],0,'Modulo-2 arithmetic has no borrows, which is just XOR.'],
yt:'cyclic redundancy check explained'},
hamming:{t:'7-bit Hamming code',len:4,def:'1011',one:'Overlapping parity bits that point at the bad bit.',
exp:['<p>Hamming(7,4) packs 4 data bits into 7 positions. Parity bits sit at positions 1, 2 and 4 (powers of two); data bits fill positions 3, 5, 6 and 7. Each parity bit watches a different overlapping group.</p><p>P1 checks positions 1,3,5,7. P2 checks 2,3,6,7. P4 checks 4,5,6,7. Each is set so its group has an even number of 1s.</p><h3>Worked example</h3><p>Data <code>1011</code> goes to D1..D4. P1 = 0, P2 = 1, P4 = 0, so the codeword is <code>0110011</code>.</p><p>Suppose position 5 flips. P1’s group and P4’s group now fail, P2’s passes. Read the failures as binary (P4 P2 P1 = <code>101</code>): that is <b>5</b>, the <b>syndrome</b>. Flip position 5 back and the data is recovered.</p>','<h3>Strengths and limits</h3><p>Corrects any single-bit error. With two flips it can “fix” the wrong bit and return bad data silently. SECDED (one extra overall parity bit) adds double-error detection.</p>'],
real:['ECC memory in servers uses Hamming-style SECDED codes.','Spacecraft and satellites protect stored data against radiation bit flips.','Flash and SSD controllers use stronger relatives of Hamming codes.'],
note:['<h3>Hamming (7,4)</h3>','P1 P2 D1 P4 D2 D3 D4','parity at <b>1, 2, 4</b>','P1:1,3,5,7  P2:2,3,6,7  P4:4,5,6,7','1011 → <b>0110011</b>','failed checks → binary → position','syndrome 101 = bit <b>5</b> → flip it','fixes 1 error <em>(2 can fool it)</em>'],
q:['Syndrome 110 (binary) means which position is wrong?',['3','6'],1,'110 in binary is 6.'],
yt:'hamming code 7,4 explained'}};
const K=Object.keys(M);
const V={parity:[['Parity Check and Parity Bits (Error Detection)','jLuj62Gq-1I'],['Error Detecting Code: Parity Explained','Bwih7_AT1oI'],['Parity Bits and Error Detection Explained','KvTc43Jt76w']],checksum:[['Checksum Error Detection method with example (one’s complement)','S4dmIdhKAJ4'],['Checksum in Computer Networks','CxjrrWt9CLU'],['Checksum for Error Detection (Lecture 52)','WTP06IWWgGA']],crc:[['Cyclic Redundancy Check (CRC), Part 1','A9g6rTMblz4'],['Cyclic Redundancy Check (CRC) example','ZJH0KT6c0B0'],['Error Detection and Correction 2: Cyclic Redundancy Check','6gbkoFciryA']],hamming:[['But what are Hamming codes? (3Blue1Brown)','X8jsijhllIA'],['How Hamming Code Corrects the Error: (7,4) encode and decode','t4kiy4Dsx5Y'],['7 Bit Hamming Code example','dhfhM_4aO8U'],['Syndrome decoding of (7,4) Hamming code','CmvF2Rc1xvo']]};

const nav=()=>{const h=location.hash.slice(1)||'home';document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',h.startsWith(a.hash.slice(1,6))))};
const home=()=>`<div class="hero2"><div>${mascot()}<span class="tag">Computer Networks</span><h1>Error detection and correction, <span class="or">made playable.</span></h1><p>Noise flips bits. Parity, checksum, CRC and Hamming code are four ways to notice, and sometimes fix, the damage. Try it: click a bit to corrupt it.</p><a class="btn p" href="#learn-parity">Start learning</a><a class="btn" href="#videos">Watch videos</a></div><div id="sim"></div></div>${flow()}<h2>Four methods, one idea</h2><div class="grid">${K.map((k,j)=>`<a class="card mc" style="--a:${CL[k]}" href="#learn-${k}"><div class="art">${art(k)}</div><span class="tag">Chapter ${j+1}</span><h3>${M[k].t}</h3><p>${M[k].one}</p></a>`).join('')}</div><h2>Using it in class</h2><div class="grid"><div class="card"><h3>Read</h3><p>Go through the explanation and worked example together.</p></div><div class="card"><h3>Watch</h3><p>Play a YouTube video for a second explanation.</p></div><div class="card"><h3>Break it</h3><p>Ask students to predict the result, then flip bits in the simulator to check.</p></div></div>`;
const CL={parity:'#2f5fb8',checksum:'#b5607f',crc:'#3f8f86',hamming:'#c4783f'};
const art=k=>M[k].def.split('').slice(0,8).map((b,i)=>`<span${i===3?' class="x"':''}>${i===3?1-b:b}</span>`).join('');
function learn(k){const m=M[k];if(!m)return nf();const i=K.indexOf(k);sm=k;sd=m.def;fl.clear();
return`<div class="chap" style="--a:${CL[k]}"><nav class="side np" aria-label="Chapters">${K.map(x=>`<a href="#learn-${x}" style="--a:${CL[x]}" class="${x===k?'on':''}"><i></i>${M[x].t}</a>`).join('')}</nav><article>
<div class="ch"><span class="tag">Chapter ${i+1} of 4</span><h2>${m.t}</h2><p class="lead">${m.one}</p><div class="art" aria-hidden="true">${art(k)}</div></div>
<div class="tabs np" role="tablist">${[['read','Read'],['watch','Watch'],['notes','Notes'],['try','Try it']].map((t,j)=>`<button role="tab" data-a="tab" data-t="${t[0]}" aria-selected="${!j}">${t[1]}</button>`).join('')}</div>
<div class="panel" id="p-read"><div class="prose">${m.exp.join('')}</div><h3>Where you meet it in real life</h3><div class="real">${m.real.map(r=>`<div class="card">${esc(r)}</div>`).join('')}</div></div>
<div class="panel vl" id="p-watch" hidden>${vids(k)}</div>
<div class="panel" id="p-notes" hidden>${more()}</div>
<div class="panel" id="p-try" hidden><div id="sim"></div><section class="s qz" data-c="${m.q[2]}"><b>${esc(m.q[0])}</b>${m.q[1].map((o,j)=>`<button class="opt" data-a="q" data-o="${j}">${esc(o)}</button>`).join('')}<p role="status" id="fb"></p></section></div>
<div class="pager np">${K[i-1]?`<a class="btn" href="#learn-${K[i-1]}">Back: ${M[K[i-1]].t}</a>`:'<span></span>'}${K[i+1]?`<a class="btn p" href="#learn-${K[i+1]}">Next: ${M[K[i+1]].t}</a>`:''}</div></article></div>`}
const NL=[['Stanford EE179 lecture notes: parity, CRC, Hamming (7,4)','https://web.stanford.edu/class/ee179/lectures/notes18.pdf'],['NPTEL (IIT Kharagpur) notes: parity, checksum, Hamming','https://archive.nptel.ac.in/content/storage2/courses/106105080/pdf/M3L2.pdf'],['WPI slides: parity, internet checksum, CRC, Hamming','https://web.cs.wpi.edu/~rek/Nets2/C13/Transmission_Errors_C13.pdf'],['GeeksforGeeks: checksum with worked example','https://www.geeksforgeeks.org/computer-networks/error-detection-code-checksum/'],['GeeksforGeeks: CRC and modulo-2 division','https://www.geeksforgeeks.org/dsa/modulo-2-binary-division/'],['Scribd: Error Detection and Correction (Hamming, CRC, checksum)','https://www.scribd.com/document/636690342/Error-Detection-and-Correction-Hamming-Code-CRC-Checksum-1']];
const more=()=>`<section class="s np"><h3>Notes links</h3><p>Lecture notes I found. These are typed or slide-style.</p><ul>${NL.map(x=>`<li><a target="_blank" rel="noopener" href="${x[1]}">${esc(x[0])}</a></li>`).join('')}</ul><p>To look for scanned handwritten notes, search: <a target="_blank" rel="noopener" href="https://www.google.com/search?q=handwritten+notes+error+detection+and+correction+parity+checksum+crc+hamming+code">Google</a> or <a target="_blank" rel="noopener" href="https://www.scribd.com/search?query=handwritten%20notes%20error%20detection%20and%20correction">Scribd</a>.</p></section>`;
const paper=k=>`<div class="paper">${M[k].note.map((l,j)=>j?`<p>${l}</p>`:l).join('')}</div>`;
function vids(k){return`<ul class="pl" style="--a:${CL[k]}">${V[k].map(x=>`<li><a href="https://www.youtube.com/watch?v=${x[1]}" target="_blank" rel="noopener"><span class="pi" aria-hidden="true">▶</span>${esc(x[0])}</a></li>`).join('')}</ul>`}
const videos=()=>`<h2>Videos</h2><p>Each link opens the video on YouTube. Every video has a written lesson in Learn.</p>${K.map(k=>`<h3>${M[k].t}</h3><a class="btn np" href="#learn-${k}">Read the written lesson</a><section class="s" style="--a:${CL[k]}">${vids(k)}</section>`).join('')}`;
const notes=()=>`<h2>Notes</h2>${more()}`;
const sim=()=>`<h2>Simulator</h2><div id="sim"></div><section class="s"><h3>What to try</h3><ul><li>Parity: flip two bits and see it miss.</li><li>Checksum: flip one bit in each of two bytes in a way that cancels.</li><li>CRC: flip a run of adjacent bits (a burst).</li><li>Hamming: flip one bit (fixed), then two (miscorrected).</li></ul></section>`;
const flow=()=>{const bt=(x,v)=>`<text class="b" x="${x}" y="82" text-anchor="middle">${v}</text>`;
const L=[1,0,1,1,0].map((v,i)=>bt(170+i*48,v)).join(''),R=[1,0,1].map((v,i)=>bt(690+i*48,v)).join('');
return`<div class="flow np"><svg viewBox="0 0 900 170" role="img" aria-label="Bits travel from a sender to a receiver. Noise flips one bit in the middle, and the receiver's check catches it."><rect x="10" y="40" width="96" height="70" rx="14" fill="none" stroke="var(--cy)" stroke-width="2.5"/><text class="bx" x="58" y="80" text-anchor="middle">SENDER</text><rect x="794" y="40" width="96" height="70" rx="14" fill="none" stroke="var(--ok)" stroke-width="2.5"/><text class="bx" x="842" y="80" text-anchor="middle">RECEIVER</text><line class="wire" x1="114" y1="75" x2="786" y2="75"/><rect x="120" y="52" width="270" height="46" rx="10" fill="var(--card)"/>${L}<path d="M400 75 q15 -34 30 0 t30 0 t30 0 t30 0" fill="none" stroke="var(--or)" stroke-width="3" stroke-linecap="round" opacity=".7"/><g class="hit"><circle cx="545" cy="75" r="22" fill="var(--or)"/><text x="545" y="83" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="22" fill="var(--on)">0</text></g><rect x="640" y="52" width="162" height="46" rx="10" fill="var(--card)"/>${R}<circle cx="742" cy="122" r="13" fill="var(--ok)"/><path d="M736 122 l5 5 l9 -10" fill="none" stroke="var(--on)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="t" x="260" y="145" text-anchor="middle">1. bits leave the sender</text><text class="t" x="480" y="145" text-anchor="middle" fill="var(--or)">2. noise flips a bit</text><text class="t" x="742" y="157" text-anchor="middle">3. the check catches it</text></svg></div>`};
const mascot=()=>`<div class="mas np"><svg viewBox="0 0 180 160" role="img" aria-label="Bit, the BitWatch mascot: a smiling blue robot holding a magnifying glass"><ellipse cx="82" cy="150" rx="40" ry="6" fill="var(--cy)" opacity=".18"/><g class="bob"><line x1="80" y1="24" x2="80" y2="40" stroke="var(--cy)" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="19" r="7" fill="var(--or)"/><rect x="48" y="128" width="26" height="14" rx="7" fill="#1b3c82"/><rect x="88" y="128" width="26" height="14" rx="7" fill="#1b3c82"/><rect x="28" y="38" width="108" height="94" rx="32" fill="var(--cy)"/><rect x="40" y="50" width="84" height="62" rx="24" fill="#f4f8ff"/><g class="eyes"><circle cx="66" cy="78" r="9" fill="#0b1a33"/><circle cx="98" cy="78" r="9" fill="#0b1a33"/><circle cx="69" cy="75" r="3" fill="#fff"/><circle cx="101" cy="75" r="3" fill="#fff"/></g><circle cx="52" cy="94" r="6" fill="#ffb3c0" opacity=".85"/><circle cx="112" cy="94" r="6" fill="#ffb3c0" opacity=".85"/><path d="M72 95 q10 11 20 0" fill="none" stroke="#0b1a33" stroke-width="3.5" stroke-linecap="round"/><g class="wave"><path d="M30 90 q-14 4 -16 -14" fill="none" stroke="var(--cy)" stroke-width="9" stroke-linecap="round"/><circle cx="14" cy="74" r="7" fill="var(--cy)"/></g><path d="M134 92 q10 4 14 -6" fill="none" stroke="var(--cy)" stroke-width="9" stroke-linecap="round"/><circle cx="150" cy="82" r="17" fill="#fff" fill-opacity=".35" stroke="var(--or)" stroke-width="5"/><path d="M143 76 a9 9 0 0 1 8 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="162" y1="95" x2="172" y2="108" stroke="var(--or)" stroke-width="6" stroke-linecap="round"/></g></svg><span class="say">Hi, I'm Bit! Flip a bit and I'll catch it.</span></div>`;
const nf=()=>'<h2>Page not found</h2><a href="#home">Go home</a>';

const bits=(n,l)=>n.toString(2).padStart(l,'0').split('').map(Number),num=a=>a.reduce((x,b)=>x*2+b,0),ones=a=>a.reduce((x,b)=>x+b,0);
const GEN=[1,0,0,0,0,0,1,1,1];
function rem(a){a=a.slice();for(let i=0;i<=a.length-9;i++)if(a[i])for(let j=0;j<9;j++)a[i+j]^=GEN[j];return a.slice(-8)}
function fold(b){let s=b.reduce((x,y)=>x+y,0);while(s>255)s=(s&255)+(s>>8);return s}
const bytes=a=>{const r=[];for(let i=0;i+8<=a.length;i+=8)r.push(num(a.slice(i,i+8)));return r};
function ham(d){let r=0;while((1<<r)<d.length+r+1)r++;const n=d.length+r,w=Array(n+1).fill(0);let k=0;for(let p=1;p<=n;p++)if(p&(p-1))w[p]=d[k++];for(let i=0;i<r;i++){const p=1<<i;let x=0;for(let q=1;q<=n;q++)if((q&p)&&q!==p)x^=w[q];w[p]=x}return w.slice(1)}
const hd=f=>f.filter((_,i)=>(i+1)&i);
function enc(m,d){if(m==='parity')return[...d,ones(d)%2];if(m==='checksum')return[...d,...bits(255-fold(bytes(d)),8)];if(m==='crc')return[...d,...rem([...d,...Array(8).fill(0)])];return ham(d)}
const HL=['P1','P2','D1','P4','D2','D3','D4'];
let sm='parity',sd=M.parity.def;const fl=new Set();
function initSim(){const el=document.getElementById('sim');if(!el)return;
const draw=()=>{const m=sm,L=M[m].len,ok=sd.length===L&&/^[01]+$/.test(sd);
let h=`<section class="s"><label>Method<select id="sm">${K.map(k=>`<option value="${k}"${k===m?' selected':''}>${M[k].t}</option>`).join('')}</select></label><label>Data (${L} bits)<input id="sd" value="${esc(sd)}" maxlength="${L}" inputmode="numeric"></label>`;
if(!ok)return el.innerHTML=h+`<p class="v b" role="alert">Enter exactly ${L} bits using only 0 and 1.</p></section>`,bind();
const d=sd.split('').map(Number),e=enc(m,d),rx=e.map((b,i)=>fl.has(i)?b^1:b),n=fl.size;let v,g=1;
if(m==='hamming'){let s=0;rx.forEach((b,i)=>{if(b)s^=i+1});if(!s){v=n?'Undetected: the flips formed another valid codeword.':'No errors: syndrome is 0.';g=!n}else{const f=rx.slice();if(s<=7)f[s-1]^=1;const r=hd(f).join('')===sd;g=r;v=r?`Syndrome ${s.toString(2).padStart(3,'0')} = position ${s}. Flipped it back: data recovered.`:`Syndrome = position ${s}. Flipped it, but the data is still wrong (miscorrection).`}}
else{const p=m==='parity'?ones(rx)%2===0:m==='checksum'?fold(bytes(rx))===255:rem(rx).every(x=>!x);if(!n)v='No errors injected: the check passes.';else if(p){v='Undetected: the check passes although the data changed.';g=0}else v='Detected: the receiver rejects the frame. It cannot say which bit is wrong.'}
el.innerHTML=h+`<p>Click bits of the <b>received frame</b> to flip them. Dashed bits are check bits.</p><div class="bits" role="group" aria-label="Received frame">${rx.map((b,i)=>{const c=m==='hamming'?!((i+1)&i):i>=L;return`<div class="cell"><button data-i="${i}" class="${fl.has(i)?'f ':''}${c?'pb':''}" aria-label="Bit ${i+1} is ${b}${fl.has(i)?', flipped':''}">${b}</button>${m==='hamming'?HL[i]:''}</div>`}).join('')}</div><div class="v ${g?'g':'b'}" role="status">${v}</div><p><button id="rs">Reset errors</button></p></section>`;bind()};
function bind(){el.querySelector('#sd').oninput=e=>{sd=e.target.value.trim();fl.clear();draw();const x=el.querySelector('#sd');x.focus();x.setSelectionRange(sd.length,sd.length)};el.querySelector('#sm').onchange=e=>{sm=e.target.value;sd=M[sm].def;fl.clear();draw()};const r=el.querySelector('#rs');if(r)r.onclick=()=>{fl.clear();draw()};el.querySelectorAll('.bits button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;fl.has(i)?fl.delete(i):fl.add(i);draw();el.querySelector(`[data-i="${i}"]`).focus()})}
draw()}

const app=document.getElementById('app');
function route(){const h=location.hash.slice(1)||'home',k=h.indexOf('-'),p=k<0?h:h.slice(0,k),id=k<0?'':h.slice(k+1);
app.innerHTML=({home,learn:()=>learn(id||'parity'),videos,sim,notes}[p]||nf)();nav();initSim()}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
document.addEventListener('click',e=>{const tb=e.target.closest('[data-a=tab]');if(tb){document.querySelectorAll('[data-a=tab]').forEach(x=>x.setAttribute('aria-selected',x===tb));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+tb.dataset.t);return}const b=e.target.closest('[data-a=q]');if(!b)return;const z=b.closest('.qz'),ok=b.dataset.o===z.dataset.c;z.querySelectorAll('.opt').forEach(o=>o.classList.remove('c','w'));b.classList.add(ok?'c':'w');z.querySelector('#fb').textContent=(ok?'Correct. ':'Not quite, try again. ')+(ok?M[location.hash.slice(7)]?.q[3]||'':'')});
route();
</script></body></html>
